# ============================================================
# 浅焦映像 · Web 版 nginx 配置示例
#
# 站点为纯静态站（无构建步骤），将 photomuse-web/ 目录的全部内容
# 放到服务器的 /var/www/photomuse-web 即可。
#
# 使用方法：
#   1. 将本文件复制为 /etc/nginx/conf.d/photomuse.conf
#      （或 sites-available/photomuse + 软链到 sites-enabled/）
#   2. 把 server_name 改成你的真实域名
#   3. nginx -t && nginx -s reload
#
# HTTPS：用 certbot 一键签发并自动改写配置，见文件末尾注释
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name photomuse.example.com;    # TODO: 换成你的域名

    root /var/www/photomuse-web;
    index index.html;

    # 照片上传单文件上限 10MB，预留请求头开销放宽到 12MB，
    # 否则上传大图会返回 413 Request Entity Too Large
    client_max_body_size 12m;

    # gzip 压缩常见文本资源
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # 静态资源缓存 7 天；html 不缓存，保证改版即时生效
    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- HTTPS（推荐，CloudBase Web SDK 要求生产环境走 HTTPS）----------
# 用 certbot 自动签发 Let's Encrypt 证书，它会自动添加 443 server 块与 80 跳转：
#
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d photomuse.example.com
#
# 证书到期前 certbot 会通过 systemd timer 自动续期，无需手工维护
